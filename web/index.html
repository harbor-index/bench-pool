<script>
  // Set the theme before first paint.
  (function () {
    var t = null;
    try { t = localStorage.getItem("bench-pool-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>

<body>
<header class="top">
  <a class="logo" href="#/list" aria-label="bench-pool home">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path class="logo-box" d="M3 4v16h18V4"/>
      <path class="logo-wave" d="M6.5 11c1.4-1.6 2.7-1.6 4.1 0s2.7 1.6 4.1 0 2.7-1.6 4.1 0M6.5 16c1.4-1.6 2.7-1.6 4.1 0s2.7 1.6 4.1 0 2.7-1.6 4.1 0"/>

  </nav>
  <div class="theme" role="group" aria-label="Theme">
    <button type="button" data-theme-set="light" aria-label="Light theme" title="Light">

    </button>
    <button type="button" data-theme-set="dark" aria-label="Dark theme" title="Dark">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>
